[package]
name = "mathnote"
version = "0.1.0"
edition = "2024"
description = "A local-first terminal notebook for natural-language mathematics and LaTeX"
license = "MIT"

[dependencies]
color-eyre = "0.6"
crossterm = "0.29"
ratatui = "0.30"
txm = { version = "0.1.6", features = ["ratatui"] }
unicode-width = "0.2"
